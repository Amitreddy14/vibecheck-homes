# Weekly dependency update PRs. Each PR must pass CI like any other change.
version: 2
updates:
  - package-ecosystem: npm # covers the whole pnpm workspace via the root lockfile
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    # Wait a few days after a release before proposing it (supply-chain safety).
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
