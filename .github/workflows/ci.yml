# CI: runs on every pull request and on every push to main.
# Both jobs must pass before a PR can merge: the ruleset on main requires
# the checks "Code checks" and "Database tests" (job names below). Renaming a job
# means updating the ruleset too, or PRs get stuck waiting.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public, non-secret value so the env check passes during the build.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      # Actions are pinned to exact commits (tag in the comment) so a hijacked tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        # Uses the pnpm version from "packageManager" in package.json.

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (for the pinned Supabase CLI)
        run: pnpm install --frozen-lockfile

      # Start only Postgres: migrations, seed and pgTAP tests don't need the other services.
      - name: Start local database (applies migrations + seed)
        run: >
          pnpm exec supabase start
          -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run database tests (pgTAP)
        run: pnpm db:test

      - name: Stop database
        if: always()
        run: pnpm exec supabase stop --no-backup
