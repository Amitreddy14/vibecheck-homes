# Nightly encrypted backup of the PRODUCTION database.
# Supabase's free plan has no backups, so this is our safety net.
# Restore steps: docs/runbooks/restore-backup.md
name: Backup production database

on:
  schedule:
    - cron: "17 20 * * *" # 20:17 UTC = 01:47 IST, every night
  workflow_dispatch:

concurrency:
  group: backup-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Dump, encrypt, store
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Separate environment (no approval) holding the production ref, password and
    # backup passphrase, so the nightly run doesn't wait for a human click.
    environment: production-backup
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check backup secrets
        run: |
          fail=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD BACKUP_PASSPHRASE; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is missing or empty (environment: production-backup)."
              fail=1
            fi
          done
          if [ -n "$SUPABASE_PROJECT_REF" ] && ! [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF must be exactly the 20-letter project ref."
            fail=1
          fi
          if [ -n "$BACKUP_PASSPHRASE" ] && [ "${#BACKUP_PASSPHRASE}" -lt 24 ]; then
            echo "::error::BACKUP_PASSPHRASE must be at least 24 characters."
            fail=1
          fi
          exit "$fail"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies (for the pinned Supabase CLI)
        run: pnpm install --frozen-lockfile

      # The three-file layout Supabase recommends for a full restore:
      # roles, then schema, then data.
      - name: Dump database
        run: |
          mkdir -p backup
          remote=(--remote="$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD")
          pnpm exec supabase db dump "${remote[@]}" --role-only -f backup/roles.sql
          pnpm exec supabase db dump "${remote[@]}" -f backup/schema.sql
          pnpm exec supabase db dump "${remote[@]}" --data-only --use-copy -f backup/data.sql
          ls -l backup

      - name: Encrypt
        id: encrypt
        run: |
          name="vibecheck-prod-$(date -u +%Y%m%dT%H%MZ)"
          tar -czf "$name.tar.gz" -C backup .
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "$name.tar.gz.gpg" "$name.tar.gz" 3<<<"$BACKUP_PASSPHRASE"
          sha256sum "$name.tar.gz.gpg" > "$name.tar.gz.gpg.sha256"
          # Only the encrypted file leaves this runner.
          rm -rf backup "$name.tar.gz"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Store encrypted backup (kept 30 days)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.encrypt.outputs.name }}
          path: |
            ${{ steps.encrypt.outputs.name }}.tar.gz.gpg
            ${{ steps.encrypt.outputs.name }}.tar.gz.gpg.sha256
          retention-days: 30
          if-no-files-found: error
